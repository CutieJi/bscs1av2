<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Reset Password - MISLend</title>
    <link rel="stylesheet" href="assets/css/reset-password.css" />
    <link rel="shortcut icon" href="assets/images/logos.png" type="image/x-icon">
</head>

<body>
    <main class="reset-page">
        <a class="brand" href="index.html" aria-label="MISLend home">
            <img src="assets/images/logos.png" alt="" />
            <span>MIS<span class="brand-accent">Lend</span></span>
        </a>

        <section class="reset-card" aria-labelledby="resetTitle">
            <h1 id="resetTitle">Choose a New Password</h1>
            <p class="reset-description">Set a new password for your MISLend account.</p>
            <p id="resetEmail" class="reset-email" hidden></p>
            <div id="resetAlert" class="reset-alert" role="status" aria-live="polite" hidden></div>

            <form id="resetPasswordForm" hidden>
                <label for="newPassword">New Password</label>
                <input id="newPassword" name="newPassword" type="password" minlength="6" autocomplete="new-password"
                    placeholder="At least 6 characters" required />

                <label for="confirmPassword">Confirm New Password</label>
                <input id="confirmPassword" name="confirmPassword" type="password" minlength="6"
                    autocomplete="new-password" placeholder="Enter your new password again" required />

                <button id="resetSubmit" type="submit" disabled>Reset Password</button>
            </form>

            <a class="login-link" href="login.html">Back to Sign In</a>
        </section>
        <p class="page-footer">University of Caloocan City &bull; MISLend</p>
    </main>

    <script src="assets/js/app.js"></script>
    <script>
        const resetToken = new URLSearchParams(window.location.search).get('token');
        const resetForm = document.getElementById('resetPasswordForm');
        const resetAlert = document.getElementById('resetAlert');
        const resetEmail = document.getElementById('resetEmail');
        const resetSubmit = document.getElementById('resetSubmit');
        const resetDescription = document.querySelector('.reset-description');

        if (window.history && window.history.replaceState) {
            window.history.replaceState(null, '', window.location.pathname);
        }

        const showResetMessage = (message, type) => {
            resetAlert.textContent = message;
            resetAlert.className = `reset-alert reset-alert-${type}`;
            resetAlert.hidden = false;
        };

        const initializeResetPage = async () => {
            if (!resetToken) {
                showResetMessage('This reset link is missing or invalid. Ask an administrator to send a new one.', 'error');
                return;
            }

            try {
                const result = await auth.verifyAdminPasswordResetToken(resetToken);
                resetEmail.textContent = `Resetting password for ${result.email}`;
                resetEmail.hidden = false;
                resetForm.hidden = false;
                resetSubmit.disabled = false;
            } catch (error) {
                showResetMessage(error.message || 'This reset link is invalid or expired. Ask an administrator to send a new one.', 'error');
            }
        };

        resetForm.addEventListener('submit', async (event) => {
            event.preventDefault();
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            if (newPassword !== confirmPassword) {
                showResetMessage('The passwords do not match. Please check and try again.', 'error');
                return;
            }

            resetSubmit.disabled = true;
            resetSubmit.textContent = 'Updating Password...';
            resetAlert.hidden = true;
            try {
                await auth.confirmAdminPasswordReset(resetToken, newPassword);
                resetForm.hidden = true;
                resetEmail.hidden = true;
                resetDescription.textContent = 'Your MISLend password has been updated.';
                showResetMessage('Password changed successfully. You can now sign in with your new password.', 'success');
            } catch (error) {
                showResetMessage(error.message || 'Unable to reset your password. Please try again.', 'error');
                resetSubmit.disabled = false;
            } finally {
                resetSubmit.textContent = 'Reset Password';
            }
        });

        initializeResetPage();
    </script>
</body>

</html>
